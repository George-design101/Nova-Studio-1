<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Nova Studio.">
  <title>Nova Studio | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <a href="index.html" class="logo">NOVA<span>STUDIO</span></a>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html" class="active">Contact</a>
  </nav>
</header>

<main>

  <section class="page-hero">
    <p class="eyebrow">LET'S TALK</p>
    <h1>Have a project<br><span>in mind?</span></h1>
  </section>

  <section class="contact-section">

    <div class="contact-intro">
      <h2>Tell us about it.</h2>

      <p>
        Have an idea, a project or simply a question?
        Send us a message and we'll get back to you.
      </p>
    </div>

    <form id="contactForm">

      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Your name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        >
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea
          id="message"
          name="message"
          rows="7"
          placeholder="Tell us about your project..."
          required
        ></textarea>
      </div>

      <button type="submit" class="button primary">
        Send Message
      </button>

      <p id="formStatus" class="form-status"></p>

    </form>

  </section>

</main>

<footer>
  <p>© 2026 Nova Studio. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
